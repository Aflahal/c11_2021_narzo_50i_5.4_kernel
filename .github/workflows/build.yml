name: Kernel Build

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Kernel defconfig name (e.g., sprd_sharkl3_defconfig)'
        required: true
        default: 'RMX3231_defconfig'
      build_kernel_module:
        description: "set to true if you want to build (.ko) file"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # General Build Variables
      KERNEL_ROOT: ${{ github.workspace }}
      ARCH: arm64
      TZ: Asia/Jakarta
      KBUILD_BUILD_USER: 'Ardhiansyah_Aflahal'
      # Ccache Flags
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache

      # Toolchain Paths
      CLANG_BASE: ${{ github.workspace }}/toolchains/clang-r383902b
      GCC_64_BASE: ${{ github.workspace }}/toolchains/gcc-14.3
      GCC_32_BASE: ${{ github.workspace }}/toolchains/gcc-14.3

      # Main Compiler and Cross-Compile Variables
      CC: "ccache clang"
      CROSS_COMPILE: "${{ github.workspace }}/toolchains/gcc-14.3/bin/aarch64-none-linux-gnu-"
      CROSS_COMPILE_ARM32: "${{ github.workspace }}/toolchains/gcc-14.3/bin/arm-none-linux-gnueabihf-"

      # UNISOC Board-Specific Properties (used by (.ko) Makefiles)
      # Android Build
      BSP_BOARD_ARCH: arm64
      BSP_BUILD_DT_OVERLAY: "y"
      BSP_BUILD_ANDROID_OS: "y"
      BSP_BUILD_FAMILY: "sharkl3"
      BSP_BOARD_NAME: "sharkl3"
      BSP_KERNEL_VERSION: "kernel5.4"

      # PowerVR
      TARGET_KERNEL_ARCH: "arm64"
      BSP_SYSTEM_VERSION: "sharkl3"
      BSP_PRODUCT_NAME: "sharkl3"
      TARGET_BOARD: "sharkl3"
      TARGET_BOARD_PLATFORM: "sharkl3"
      PLATFORM_RELEASE: "12"
      PLATFORM_VERSION: "12"
      PLATFORM_VERSION_CODENAME: "S"
      PLATFORM_CODENAME: "S"
      BSP_ROOT_DIR: "${{ github.workspace }}"
      BSP_OUT_PLATFORM: "${{ github.workspace }}/out"
      BSP_KERNEL_OUT: "${{ github.workspace }}/out"
      NDK_PLATFORMS_ROOT: "${{ github.workspace }}/prebuilts/ndk/platforms"

      # WCN
      BSP_BOARD_UNISOC_WCN_SOCKET: "sipc"
      BSP_BOARD_WLAN_DEVICE: "sc2332"

      # Camera
      BSP_BOARD_CAMERA_MODULE_ISP_ADAPT_VERSION: "sharkl3"
      BSP_BOARD_CAMERA_MODULE_ISP_VERSION: "isp2.6"
      BSP_BOARD_CAMERA_MODULE_CSI_VERSION: "receiver_r2p0"
      BSP_BOARD_CAMERA_MODULE_CPP_VERSION: "lite_r4p0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create build directories
        run: |
          mkdir -p "${{ github.workspace }}/out" "${{ github.workspace }}/build" "${{ github.workspace }}/toolchains" "${{ github.workspace }}/modules_out"

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains
          key: ${{ runner.os }}-toolchains-v3

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup System Dependencies
        run: |
          echo "[INFO]: Installing system requirements..."
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            git device-tree-compiler lz4 xz-utils zlib1g-dev zip make gcc g++ \
            python3 python-is-python3 libncurses-dev flex bison gperf libssl-dev \
            libelf-dev kmod pahole zstd libyaml-dev ccache

      - name: Download and Set up Toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          echo "[INFO] Setting up Toolchains..."
          cd "${{ github.workspace }}/toolchains"
          
          echo "--> Downloading Clang..."
          mkdir -p clang-r383902b
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang-r383902b && rm clang.tar.gz
          
          echo "--> Downloading GCC 14.3..."
          mkdir -p gcc-14.3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C gcc-14.3 --strip-components=1 && rm gcc.tar.xz

          echo "--> Setting permissions..."
          chmod +x ${{ env.CLANG_BASE }}/bin/*
          chmod +x ${{ env.GCC_64_BASE }}/bin/*
          
      - name: Set up PATH and ccache
        run: |
          echo "${{ env.CLANG_BASE }}/bin" >> $GITHUB_PATH
          echo "${{ env.GCC_64_BASE }}/bin" >> $GITHUB_PATH

          echo "[INFO]: Configuring ccache..."
          ccache -M 5G
          ccache -z

      - name: Write Shared Make Arguments
        run: |
          # Every step runs in its own shell, so share the make arguments via a sourced file
          cat > "${RUNNER_TEMP}/make_args.sh" <<'EOF'
          SRC="${GITHUB_WORKSPACE}"
          OUT="${SRC}/out"
          MOD_OUT="${SRC}/modules_out"

          TOOLCHAIN_ARGS=(
            LLVM=1
            LLVM_IAS=1
            ARCH="${ARCH}"
            CC="${CC}"
            LD="ld.lld"
            AR="llvm-ar"
            NM="llvm-nm"
            OBJCOPY="llvm-objcopy"
            OBJDUMP="llvm-objdump"
            STRIP="llvm-strip"
            CROSS_COMPILE="${CROSS_COMPILE}"
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}"
            CLANG_TRIPLE="aarch64-none-linux-gnu-"
          )
          EOF

      - name: Build Kernel, Modules, and DTBs
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/make_args.sh"
          echo -e "\n[INFO]: KERNEL BUILD STARTED..!\n"

          # Build metadata
          export KBUILD_BUILD_HOST="$(. /etc/os-release && echo ${NAME}-${VERSION_ID})"
          export KBUILD_BUILD_TIMESTAMP="$(date '+%a %b %d %T WIB %Y')"

          # Ignore yaml (dt_to_yaml is not needed for this build)
          sed -i '/yamltree.o/d' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c

          echo "[INFO]: Generating config from ${{ inputs.defconfig }}"
          make -C "${SRC}" O="${OUT}" "${TOOLCHAIN_ARGS[@]}" "${{ inputs.defconfig }}"

          # Disable DWARF so every module (in-tree and out-of-tree) is small from the start
          echo "[INFO]: Disabling debug info"
          scripts/config --file "${OUT}/.config" \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_REDUCED \
            -d DEBUG_INFO_SPLIT \
            -d DEBUG_INFO_BTF
          make -C "${SRC}" O="${OUT}" "${TOOLCHAIN_ARGS[@]}" olddefconfig

          # Fail early if another option re-enabled debug info
          if grep -q '^CONFIG_DEBUG_INFO=y' "${OUT}/.config"; then
            echo "[ERROR]: CONFIG_DEBUG_INFO is still enabled after olddefconfig"
            exit 1
          fi

          make -C "${SRC}" O="${OUT}" -j"$(nproc)" "${TOOLCHAIN_ARGS[@]}" Image modules dtbs

          echo -e "\n[INFO]: KERNEL BUILD FINISHED..!"
          ccache -s

      - name: Install In-Tree Kernel Modules
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/make_args.sh"
          echo "[INFO]: Installing in-tree kernel modules (debug sections stripped)..."
          make -C "${SRC}" O="${OUT}" "${TOOLCHAIN_ARGS[@]}" \
            INSTALL_MOD_PATH="${MOD_OUT}" \
            INSTALL_MOD_STRIP=1 \
            modules_install

      - name: Build and Install Out-of-Tree Modules
        if: ${{ inputs.build_kernel_module == true }}
        env:
          # Format: <ko_name>:<driver_path>:<extra_make_args or NONE>
          OOT_MODULES: |
            sprd_sensor:drivers/modules/common/camera/sensor:NONE
            sprd_flash_drv:drivers/modules/common/camera/flash/flash_drv:NONE
            flash_ic_ocp8135b:drivers/modules/common/camera/flash/ocp8135b:NONE
            sprd_camera:drivers/modules/common/camera/core:NONE
            sprd_cpp:drivers/modules/common/camera/cpp:NONE
            pvrsrvkm:drivers/modules/kernel5.4/gpu/rogue/driver/build/linux/sharkl3_android:NONE
            chipone-tddi:drivers/modules/kernel5.4/input/touchscreen/chipone_tddi_k630:NONE
            focaltech_ft8756_spi_ts:drivers/modules/kernel5.4/input/touchscreen/focaltech_ft8756_spi:NONE
            sprd_fm:drivers/modules/kernel5.4/wcn/fm/driver:NONE
            sprdbt_tty:drivers/modules/kernel5.4/wcn/bluetooth/driver:NONE
            microarray_fp:drivers/modules/kernel5.4/input/fingerprint/microarray:NONE
            sunwave_sw9058g_fp:drivers/modules/kernel5.4/input/fingerprint/sunwave_sw9058g:NONE
            tcs3430:drivers/modules/kernel5.4/input/misc/tcs3430:NONE
            #sprdwl_ng:drivers/modules/kernel5.4/wcn/wlan:NONE
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/make_args.sh"

          export BSP_KERNEL_PATH="${OUT}"
          export BSP_MODULES_OUT="${OUT}"
          EXTRA_SYMBOLS=""

          # Board properties passed on the command line (overrides makefile defaults)
          BSP_ARGS=(
            BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}"
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}"
            BSP_BUILD_DT_OVERLAY="${BSP_BUILD_DT_OVERLAY}"
            BSP_KERNEL_VERSION="${BSP_KERNEL_VERSION}"
            BSP_BOARD_UNISOC_WCN_SOCKET="${BSP_BOARD_UNISOC_WCN_SOCKET}"
            BSP_BOARD_WLAN_DEVICE="${BSP_BOARD_WLAN_DEVICE}"
            BSP_BOARD_CAMERA_MODULE_ISP_ADAPT_VERSION="${BSP_BOARD_CAMERA_MODULE_ISP_ADAPT_VERSION}"
            BSP_BOARD_CAMERA_MODULE_ISP_VERSION="${BSP_BOARD_CAMERA_MODULE_ISP_VERSION}"
            BSP_BOARD_CAMERA_MODULE_CSI_VERSION="${BSP_BOARD_CAMERA_MODULE_CSI_VERSION}"
            BSP_BOARD_CAMERA_MODULE_CPP_VERSION="${BSP_BOARD_CAMERA_MODULE_CPP_VERSION}"
          )

          # pvrsrvkm uses its own Android-style build system and needs extra arguments
          PVR_DIR="${SRC}/drivers/modules/kernel5.4/gpu/rogue/driver/build/linux"
          PVR_ARGS=(
            ANDROID_ROOT="${SRC}"
            TARGET_BOARD_PLATFORM="${TARGET_BOARD_PLATFORM}"
            TARGET_BOARD="${TARGET_BOARD}"
            TARGET_KERNEL_ARCH="${TARGET_KERNEL_ARCH}"
            BSP_SYSTEM_VERSION="${BSP_SYSTEM_VERSION}"
            BSP_PRODUCT_NAME="${BSP_PRODUCT_NAME}"
            PLATFORM_VERSION="${PLATFORM_VERSION}"
            PLATFORM_VERSION_CODENAME="${PLATFORM_VERSION_CODENAME}"
            BSP_ROOT_DIR="${BSP_ROOT_DIR}"
            BSP_OUT_PLATFORM="${BSP_OUT_PLATFORM}"
            BSP_KERNEL_OUT="${BSP_KERNEL_OUT}"
            BSP_KERNEL_CROSS_COMPILE="${CROSS_COMPILE}"
            KCFLAGS="-Wno-unknown-warning-option -Wno-cast-function-type -Wno-error=enum-conversion -Wno-error=missing-field-initializers"
            EXTRA_CFLAGS="-Wno-unknown-warning-option -Wno-cast-function-type"
          )

          prepare_pvr() {
            echo "[INFO]: Applying pvrsrvkm build workarounds..."
            # Dummy NDK include dir (prebuilt NDK is not available in CI)
            mkdir -p "${SRC}/prebuilts/ndk/platforms/android-31/arch-arm64/usr/include"
            # Turn fatal $(error ...) in makefiles into warnings (this also covers JAVA_HOME)
            find "${PVR_DIR}" -name "*.mk" -exec sed -i 's/\$(error/\$(warning/g' {} +
            # Dummy script for prepare-llvm-android.sh
            mkdir -p "${PVR_DIR}/tools"
            touch "${PVR_DIR}/tools/prepare-llvm-android.sh"
            chmod +x "${PVR_DIR}/tools/prepare-llvm-android.sh"
          }

          # Read the list on fd 3 so commands inside the loop cannot swallow stdin
          while IFS=: read -r KO_NAME REL_PATH EXTRA_ARGS <&3; do
            case "${KO_NAME}" in ''|'#'*) continue ;; esac

            DRIVER_PATH="${SRC}/${REL_PATH}"
            if [ ! -f "${DRIVER_PATH}/Makefile" ]; then
              echo "[WARN]: Makefile not found for ${KO_NAME} at ${DRIVER_PATH}, skipping"
              continue
            fi

            echo "--> Building ${KO_NAME}..."
            MOD_ARGS=()
            if [ -n "${EXTRA_SYMBOLS}" ]; then
              MOD_ARGS+=(KBUILD_EXTRA_SYMBOLS="${EXTRA_SYMBOLS}")
            fi
            if [ -n "${EXTRA_ARGS}" ] && [ "${EXTRA_ARGS}" != "NONE" ]; then
              MOD_ARGS+=(${EXTRA_ARGS})
            fi
            if [ "${KO_NAME}" = "pvrsrvkm" ]; then
              prepare_pvr
              MOD_ARGS+=("${PVR_ARGS[@]}")
            fi

            make -C "${DRIVER_PATH}" "${TOOLCHAIN_ARGS[@]}" "${BSP_ARGS[@]}" "${MOD_ARGS[@]}" modules

            # Locate the build output directory of this module
            if [ "${KO_NAME}" = "pvrsrvkm" ]; then
              MOD_DIR="${OUT}/sharkl3/obj/modules/pvrsrvkm/target_aarch64/kbuild"
              mkdir -p "${OUT}/pvrsrvkm"
              cp "${MOD_DIR}/pvrsrvkm.ko" "${OUT}/pvrsrvkm/"
              echo "--> pvrsrvkm.ko copied to ${OUT}/pvrsrvkm"
            else
              MOD_DIR="${OUT}/${KO_NAME}"
            fi

            # Export symbols so later modules can link against this one
            if [ -f "${OUT}/${KO_NAME}/Module.symvers" ]; then
              EXTRA_SYMBOLS="${EXTRA_SYMBOLS} ${OUT}/${KO_NAME}/Module.symvers"
            fi

            echo "--> Installing ${KO_NAME} (debug sections stripped)..."
            make -C "${OUT}" M="${MOD_DIR}" "${TOOLCHAIN_ARGS[@]}" \
              INSTALL_MOD_PATH="${MOD_OUT}" \
              INSTALL_MOD_STRIP=1 \
              modules_install
          done 3<<< "${OOT_MODULES}"

          echo "[INFO]: Generating final module dependency files..."
          KERNEL_VERSION="$(awk '{print $3}' "${OUT}/include/generated/utsrelease.h" | tr -d '"')"
          touch "${MOD_OUT}/lib/modules/${KERNEL_VERSION}/modules.builtin.modinfo"
          depmod -a -b "${MOD_OUT}" "${KERNEL_VERSION}"

      - name: Verify Modules Are Stripped
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' ko; do
            # Capture first: "readelf | grep -q" can fail under pipefail (SIGPIPE) even on a match
            sections="$(readelf -S "${ko}")"
            if grep -q '\.debug_' <<< "${sections}"; then
              echo "[ERROR]: debug sections found in ${ko}"
              bad=1
            fi
          done < <(find "${GITHUB_WORKSPACE}/modules_out" -name '*.ko' -print0)
          [ "${bad}" -eq 0 ] || exit 1

          echo "[INFO]: All modules are stripped. Largest modules:"
          find "${GITHUB_WORKSPACE}/modules_out" -name '*.ko' -printf '%s %f\n' | sort -rn | head -10

      # <--- ADDED SECTION: Package the DTB and DTBO files --->
      - name: Package DTB and DTBO files
        run: |
          echo "[INFO]: Packaging DTB and DTBO files..."
          mkdir -p "${{ github.workspace }}/build/dtb"
          
          # The standard location for UNISOC DTBs is arch/arm64/boot/dts/sprd
          DTB_SOURCE_DIR="${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/dts/sprd"
          DTB_DEST_DIR="${{ github.workspace }}/build/dtb"
          
          if [ -d "$DTB_SOURCE_DIR" ]; then
              echo "--> Found DTB directory at $DTB_SOURCE_DIR"
              find "$DTB_SOURCE_DIR" -name "*.dtb" -exec cp {} "$DTB_DEST_DIR/" \;
              find "$DTB_SOURCE_DIR" -name "*.dtbo" -exec cp {} "$DTB_DEST_DIR/" \;
          else
              echo "::warning:: Standard UNISOC DTB directory not found. Searching all of boot/dts..."
              find "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/dts" -name "*.dtb" -exec cp {} "$DTB_DEST_DIR/" \;
              find "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/dts" -name "*.dtbo" -exec cp {} "$DTB_DEST_DIR/" \;
          fi

          if [ -z "$(ls -A $DTB_DEST_DIR)" ]; then
              echo "::error::No DTB or DTBO files were found after the build. Check the build logs."
              exit 1
          else
              echo "--> DTB/DTBO files successfully packaged."
              ls -lR $DTB_DEST_DIR
          fi

      - name: Package Kernel and All Modules
        run: |
          echo "[INFO]: Packaging kernel and module artifacts..."
          cp "${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot/Image" "${{ github.workspace }}/build/Image"
          
          cd "${{ github.workspace }}/modules_out"
          
          echo "[INFO]: Removing 'source' and 'build' symlinks to prevent zip recursion..."
          find . -type l -name "source" -delete
          find . -type l -name "build" -delete
          
          echo "[INFO]: Zipping all modules..."
          zip -r9 "${{ github.workspace }}/build/modules-${{ github.run_id }}.zip" .
          
          echo "Kernel Image, Modules ZIP, and DTBs are ready in the 'build' directory."
          ls -lR ${{ github.workspace }}/build

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_id }}
          path: ${{ github.workspace }}/build/*
          retention-days: 7
